<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>404 — Page Not Found | The Audio Project</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{
  height:100%;background:#000;color:#fff;overflow:hidden;
  font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;
}

/* ── Canvas starfield ── */
#stars{position:fixed;inset:0;z-index:0;}

/* ── Noise vignette ── */
body::after{
  content:'';position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.75) 100%);
}

/* ── Main card ── */
.wrap{
  position:relative;z-index:10;
  height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:24px;
  gap:0;
}

/* Logo */
.logo{height:44px;width:auto;margin-bottom:48px;opacity:.85;}

/* 404 glitch number */
.err-num{
  font-size:clamp(7rem,20vw,13rem);
  font-weight:900;line-height:1;
  letter-spacing:-.04em;
  background:linear-gradient(135deg,#e8192c 0%,#ff6b35 50%,#e8192c 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  position:relative;
  animation:glitchNum 6s steps(1) infinite;
}
@keyframes glitchNum{
  0%,90%,100%{text-shadow:none;transform:none;}
  91%{text-shadow:-3px 0 #00ffff;transform:translate(-2px,0);}
  92%{text-shadow: 3px 0 #ff00ff;transform:translate( 2px,0);}
  93%{text-shadow:-3px 0 #00ffff;transform:translate(-1px,1px);}
  94%{text-shadow:none;transform:none;}
}

.err-line{
  width:60px;height:2px;
  background:linear-gradient(to right,transparent,#e8192c,transparent);
  margin:18px auto 24px;
}

.err-title{
  font-size:clamp(1.1rem,2.5vw,1.6rem);
  font-weight:700;letter-spacing:.02em;margin-bottom:14px;
}

.err-desc{
  font-size:clamp(.82rem,1.5vw,1rem);
  color:rgba(255,255,255,.5);line-height:1.75;
  max-width:480px;margin-bottom:40px;
}

/* Buttons */
.btn-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}

.btn-home{
  display:inline-flex;align-items:center;gap:9px;
  padding:13px 30px;border-radius:50px;
  background:#e8192c;color:#fff;
  font-size:.78rem;font-weight:700;letter-spacing:.10em;text-transform:uppercase;
  text-decoration:none;border:none;cursor:pointer;
  box-shadow:0 0 28px rgba(232,25,44,.4);
  transition:all .25s ease;
}
.btn-home:hover{background:#c41020;transform:translateY(-2px);box-shadow:0 6px 36px rgba(232,25,44,.55);}
.btn-home svg{width:14px;height:14px;fill:currentColor;}

.btn-back{
  display:inline-flex;align-items:center;gap:9px;
  padding:12px 26px;border-radius:50px;
  background:transparent;color:rgba(255,255,255,.65);
  font-size:.78rem;font-weight:500;letter-spacing:.10em;text-transform:uppercase;
  text-decoration:none;cursor:pointer;
  border:1px solid rgba(255,255,255,.20);
  transition:all .25s ease;
}
.btn-back:hover{border-color:rgba(255,255,255,.5);color:#fff;transform:translateY(-2px);}

/* Sound wave decoration */
.wave-row{
  display:flex;align-items:flex-end;gap:4px;height:32px;
  margin-bottom:36px;opacity:.35;
}
.wave-bar{
  width:3px;border-radius:3px;
  background:#e8192c;
  animation:waveAnim 1.3s ease-in-out infinite;
}
.wave-bar:nth-child(1){height:10px;animation-delay:0s;}
.wave-bar:nth-child(2){height:22px;animation-delay:.10s;}
.wave-bar:nth-child(3){height:32px;animation-delay:.20s;}
.wave-bar:nth-child(4){height:18px;animation-delay:.30s;}
.wave-bar:nth-child(5){height:28px;animation-delay:.40s;}
.wave-bar:nth-child(6){height:14px;animation-delay:.50s;}
.wave-bar:nth-child(7){height:24px;animation-delay:.60s;}
@keyframes waveAnim{
  0%,100%{transform:scaleY(1);}
  50%{transform:scaleY(1.7);}
}

/* Footer note */
.err-footer{
  position:fixed;bottom:24px;left:0;right:0;
  text-align:center;
  font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;
  color:rgba(255,255,255,.20);z-index:10;
}
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="wrap">
  <img class="logo" src="logo.jpg" alt="The Audio Project">

  <div class="wave-row">
    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div>
  </div>

  <div class="err-num">404</div>
  <div class="err-line"></div>
  <h1 class="err-title">Page Not Found</h1>
  <p class="err-desc">
    The page you're looking for has been moved, removed, or never existed.<br>
    Let's get you back to the music.
  </p>

  <div class="btn-row">
    <a class="btn-home" href="index.html">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Back to Home
    </a>
    <a class="btn-back" href="javascript:history.back()">
      ← Go Back
    </a>
  </div>
</div>

<p class="err-footer">© 2026 The Audio Project — Kochi, Kerala</p>

<script>
/* Starfield canvas */
(function(){
  const c   = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let W, H, stars = [];

  function resize(){
    W = c.width  = window.innerWidth;
    H = c.height = window.innerHeight;
    stars = Array.from({length:180}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.3+.2,
      a: Math.random()*.7+.15,
      sp: Math.random()*.3+.05,
      ph: Math.random()*Math.PI*2
    }));
  }
  resize();
  window.addEventListener('resize', resize);

  let t = 0;
  (function draw(){
    requestAnimationFrame(draw);
    ctx.clearRect(0,0,W,H);
    t += .008;
    stars.forEach(s => {
      const tw = s.a * (.5 + .5*Math.sin(t*s.sp*4 + s.ph));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${tw})`;
      ctx.fill();
    });
  })();

  /* Subtle parallax on mouse move */
  document.addEventListener('mousemove', e => {
    const mx = (e.clientX/W - .5) * 18;
    const my = (e.clientY/H - .5) * 18;
    c.style.transform = `translate(${mx}px,${my}px) scale(1.04)`;
  });
})();
</script>
</body>
</html>
